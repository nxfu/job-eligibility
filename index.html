  <body class="bg-white text-zinc-900 dark:bg-black dark:text-zinc-100 antialiased selection:bg-zinc-800 selection:text-white dark:selection:bg-zinc-200 dark:selection:text-black">
    <script>
      // Synchronize theme class before first paint to prevent FOUC
      (function() {
        var saved = localStorage.getItem('jec_theme');
        var prefersDark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = saved ? saved === 'dark' : prefersDark;
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

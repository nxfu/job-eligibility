<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Eligibility Checker — AI-Powered Career Assessment</title>
    <meta name="description" content="Evaluate your skills, education, and experience against real job role requirements. Get personalized recommendations to improve your career readiness." />

    <!-- Open Graph -->
    <meta property="og:title" content="Job Eligibility Checker — AI-Powered Career Assessment" />
    <meta property="og:description" content="Evaluate your skills, education, and experience against real job role requirements. Get personalized recommendations to improve your career readiness." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://job.gaury.dev/" />
    <meta property="og:image" content="https://job.gaury.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Job Eligibility Checker" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Job Eligibility Checker — AI-Powered Career Assessment" />
    <meta name="twitter:description" content="Evaluate your skills, education, and experience against real job role requirements." />
    <meta name="twitter:image" content="https://job.gaury.dev/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://job.gaury.dev/" />

    <!-- Additional -->
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Group 18" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-white text-zinc-900 dark:bg-black dark:text-zinc-100 antialiased selection:bg-zinc-800 selection:text-white dark:selection:bg-zinc-200 dark:selection:text-black">
    <script>
      // Synchronize theme class before first paint to prevent FOUC
      (function() {
        var saved = localStorage.getItem('jec_theme');
        var prefersDark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = saved ? saved === 'dark' : prefersDark;
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
